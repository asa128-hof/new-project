name: Python Integration CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8

    - name: Lint with flake8
      run: |
        # Проверка синтаксических ошибок и стиля кода
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Integration Tests with Coverage
      run: |
        # Запуск тестов с генерацией отчета о покрытии кода (coverage)
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=src --cov-report=term-missing
